# 小区地下室默认规则集
#
# 作用：在项目标准到位之前提供可运行的默认值。所有数值都可以被项目规则文件覆盖。
# confirmed: false 表示该条是开发代理按常见做法推定、尚未经工程师确认，报告中会单独列出。
# 单位：毫米。

name: 小区地下室默认规则
version: 0.3.0

# ---------------------------------------------------------------------------
# 系统分类。group 用于净距矩阵，pressure 用于“有压让无压”等排布规则（R1 使用）。
# ---------------------------------------------------------------------------
system_classes:
  fire_hydrant:      {label: 消火栓,       group: water, pressure: true,  insulation_mm: 0}
  sprinkler:         {label: 自动喷水,     group: water, pressure: true,  insulation_mm: 0}
  fire_other:        {label: 其他消防水,   group: water, pressure: true,  insulation_mm: 0}
  water_supply:      {label: 生活给水,     group: water, pressure: true,  insulation_mm: 20}
  hot_water:         {label: 热水,         group: water, pressure: true,  insulation_mm: 30}
  pressure_drainage: {label: 压力排水,     group: water, pressure: true,  insulation_mm: 0}
  gravity_drainage:  {label: 重力排水,     group: water, pressure: false, insulation_mm: 0}
  smoke_exhaust:     {label: 排烟/排风兼排烟, group: air, pressure: true, insulation_mm: 0}
  exhaust_air:       {label: 排风,         group: air,   pressure: true,  insulation_mm: 0}
  supply_air:        {label: 送风/补风,    group: air,   pressure: true,  insulation_mm: 0}
  pressurization:    {label: 加压送风,     group: air,   pressure: true,  insulation_mm: 0}
  power_tray:        {label: 强电桥架,     group: power, pressure: false, insulation_mm: 0}
  weak_tray:         {label: 弱电/消防电桥架, group: weak, pressure: false, insulation_mm: 0}
  unknown:           {label: 未识别,       group: other, pressure: true,  insulation_mm: 0}

# ---------------------------------------------------------------------------
# 分类规则：自上而下，第一条命中即用。
#   domain: 适用的专业（pipe 水管 / duct 风管 / tray 桥架线管）。管件、附件按其所属专业判断
#   code: 正则，匹配系统类型名或系统缩写（任一命中即可；本项目两者多数相同，如 J2、YF）
#   system_type / type_name / system_code: 正则，匹配对应字段（忽略大小写）
# ---------------------------------------------------------------------------
classification:
  # --- 桥架：按类型名（模型中桥架未设置服务类型） ---
  - {class: weak_tray,  domain: tray, type_name: "弱电|火灾|报警|消防广播|广播|智能化|安防|通信|网络", confirmed: true}
  - {class: power_tray, domain: tray, type_name: "强电|母线|高压|充电桩|UPS|动力|照明|应急", confirmed: true}
  - {class: power_tray, domain: tray, type_name: ".*", confirmed: false, note: 未识别的桥架类型按强电处理}

  # --- 水管：按系统缩写 ---
  - {domain: pipe, class: fire_hydrant,      code: "^X\\d*$",         confirmed: false, note: X 按消火栓}
  - {domain: pipe, class: sprinkler,         code: "^ZP\\d*$",        confirmed: false, note: ZP 按自动喷水}
  - {domain: pipe, class: fire_other,        code: "^XW\\d*$",        confirmed: false, note: XW 含义待确认}
  - {domain: pipe, class: hot_water,         code: "^(RJ|RH)\\d*$",   confirmed: false}
  - {domain: pipe, class: pressure_drainage, code: "^(YF|YW|YY)\\d*$", confirmed: false, note: YF 按压力废水}
  - {domain: pipe, class: gravity_drainage,  code: "^(F|W|T|Y|N)\\d*$", confirmed: false, note: F/W/T/Y/N 按重力废水、污水、通气、雨水、冷凝水}
  - {domain: pipe, class: water_supply,      code: "^J[A-Z]*\\d*$",   confirmed: false, note: J0-J3、JZ、JS、JG 均按生活给水}

  # --- 风管：按系统缩写或系统类型名 ---
  - {domain: duct, class: smoke_exhaust,  code: "^PY",               confirmed: false}
  - {domain: duct, class: smoke_exhaust,  system_type: "排烟",               confirmed: true}
  - {domain: duct, class: pressurization, code: "^JY",               confirmed: false}
  - {domain: duct, class: pressurization, system_type: "加压",               confirmed: true}
  - {domain: duct, class: exhaust_air,    code: "^PF",               confirmed: false}
  - {domain: duct, class: exhaust_air,    system_type: "排风",               confirmed: true}
  - {domain: duct, class: supply_air,     system_type: "送风|补风|新风",     confirmed: true}

  # --- 兜底：按导出工具的 system_code ---
  - {class: sprinkler,     system_code: "FIRE_PROTECTION", system_type: "喷淋", confirmed: true}
  - {class: fire_other,    system_code: "FIRE_PROTECTION", confirmed: false}
  - {class: smoke_exhaust, system_code: "SMOKE_EXHAUST",   confirmed: true}

# ---------------------------------------------------------------------------
# 净距（外轮廓含保温之间的最小距离）。按 group 两两查表，未列出的用 default。
# ---------------------------------------------------------------------------
clearance_mm:
  # 2026-10-01 工程师确认：按雍景地下室人工调整后模型实测校准（桥架与水管实测中位 179 mm）。
  default: 30
  pairs:
    - {a: power, b: water,     mm: 150, confirmed: true, note: 强电桥架与水管；GB 50303 交叉净距 0.3 m 为更严的参照值}
    - {a: weak,  b: water,     mm: 60,  confirmed: true, note: 弱电、消防电桥架与水管}
    - {a: power, b: weak,      mm: 300, confirmed: true, note: 强弱电桥架之间；2026-10-02 按电气设计说明改为 300（原按人工模型校准 50）。有接地金属隔板时可局部减小，作为例外登记}
    - {a: any,   b: structure, mm: 50,  confirmed: true, note: 机电与梁、柱外表面}

# ---------------------------------------------------------------------------
# 净高
# ---------------------------------------------------------------------------
headroom:
  floor_level: auto          # auto：取机电构件下方最近的主模型标高
  min_clear_mm: 2200         # JGJ 100-2015 小型车车道及停车位最小净高 2.2 m；2026-10-01 确认为硬性最低值
  lane_clear_mm: null        # 2026-10-02：车道不设单一控制值。硬下限仍为 2200；车道净高“尽量统一、允许分级”，
  stall_clear_mm: null       #   作为扩大范围后全局排布的优化目标与方案研讨重点（评估中统计车道净高的最低值、中位值与分级数）
  confirmed: true
  note: 以楼层标高为地面、机电外轮廓（含保温）底为顶计算；综合支吊架横担预留在 R2 加入

# ---------------------------------------------------------------------------
# 障碍物：project.json 中这些类别的网格参与检测
# ---------------------------------------------------------------------------
obstacles:
  beam:       ["结构框架", "Structural Framing"]
  column:     ["结构柱", "Structural Columns", "柱", "Columns"]
  foundation: ["结构基础", "Structural Foundations"]
  wall:       ["墙", "Walls"]          # 机电穿墙单独列为“穿墙”，不计入碰撞

# 两个构件在连接关系中相距不超过该跳数时不做检测（管段与其管件、管件两侧的管段、变径加弯头等组合）
connected_hops_ignored: 3

# ---------------------------------------------------------------------------
# 分层排布（R1）
# ---------------------------------------------------------------------------
layout:
  max_layers: 4
  support_reserve_mm: 100      # 最下层横担及以下的预留，计入净高
  layer_gap_min_mm: 100        # 上下两层之间的最小净空（横担 + 安装）
  beam_clearance_mm: 50        # 最上层顶到梁底
  moved_threshold_mm: 20       # 位移小于该值视为未动
  crossing_zone: top           # 横穿走廊的支管走在管线束上方：顶部预留“横穿层”（横穿管最大高度 + 净距）；none 不预留
  crossing_zone_max_mm: 250    # 只为高度不超过该值的横穿管预留；更大的横穿管（大风管等）在节点处局部翻弯，列为节点冲突
  lane_priority_max_mm: 300    # 车道优先：在不降低整体最低管底的前提下，车道上方最多再抬高 300 mm（避免为车道把管线全部叠层）
  slab_thickness_mm: 250       # 地下室顶板厚（结构图：未注明板厚 250 mm；人防区 200）。横穿支管可在梁间升至板底
  elevation_step_mm: 50        # 2026-10-01 确认：层底标高按 50 mm 一档（相对楼面）
  tray_top_clearance_mm: 50    # 桥架顶距梁底 / 楼板 / 上层管线。GB 51348 为“不宜小于 0.3 m”，取值待工程师确定
  tray_bottom_preferred_mm: 2500   # 2026-10-02 确认（电气设计说明）：桥架底边不宜低于 2.5 m（软）；不应低于 2.2 m（硬，同净高下限）
  bends:                       # 节点可施工检查（默认值，待确认）
    pipe_bend_factor: 1.5      # 水管弯头弯曲半径 = 1.5 × 外径
    duct_bend_factor: 1.0      # 风管弯头弯曲半径 = 1.0 × 弯曲平面内的边长
    tray_bend_radius_mm: 300   # 桥架弯通最小弯曲半径（电缆弯曲）
    min_straight_mm: 50        # 两个管件之间最少直段
    confirmed: false
  tray_water:                  # 2026-10-01 工程师确认：电上水下
    parallel_over_tray: forbid     # 不允许水管长距离平行覆盖在桥架正上方
    parallel_max_mm: 500           # 平面上沿桥架方向重叠超过该长度视为平行覆盖
    crossing_over_tray: allow      # 允许短距离交叉跨越
    leak_prone_over_tray: forbid   # 桥架正上方避免法兰、阀门、活接、排气阀等易漏节点
    leak_prone_margin_mm: 100      # 易漏节点按桥架平面外扩该距离判断
    leak_prone_pattern: "法兰|活接|由任|排气|阀"   # 管件族/类型名；管道附件（阀门等）全部计入
    crossing_above_mm: 200         # 2026-10-02 确认（电气设计说明）：水管在桥架上方交叉时间距 ≥ 200 mm，并设防水挡板
    confirmed: true
  confirmed: false
  preferences:                 # 软约束权重（越大越优先）
    trays_above_water: 50      # 电上水下：桥架层位尽量不低于水管（平面不重叠时只作偏好）
    ducts_top: 0               # 2026-10-02 取消：电气设计说明要求桥架与风道交叉时桥架上返
    tray_bottom: 5             # 桥架底低于 2.5 m 时每 10 mm 的扣分
    system_together: 20        # 同一系统尽量同层
    exit_side: 40              # 出线方向：向一侧拐出走廊的管线排在同层该侧
    exit_top: 30               # 有侧向引出的管线优先放在上层（引出立管不穿越上层）
