[project]
name = "lwp"
version = "0.1.0"
description = "Lightweight pipeline: MEP coordination toolbox (R0: import, health check, clash/clearance/headroom detection)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "ortools>=9.15.6755",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.scripts]
lwp = "lwp.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lwp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
