<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="1200" height="330" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <g font-size="18" text-anchor="middle">
    <g><rect x="20" y="60" width="190" height="110" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
      <text x="115" y="100" font-weight="700">Revit 2020 导出</text><text x="115" y="128" font-size="14">机电、结构、轴网、标高</text><text x="115" y="150" font-size="14">连接关系</text></g>
    <g><rect x="250" y="60" width="190" height="110" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
      <text x="345" y="100" font-weight="700">体检与检测</text><text x="345" y="128" font-size="14">碰撞、净距、净高</text><text x="345" y="150" font-size="14">模型质量</text></g>
    <g><rect x="480" y="60" width="210" height="110" rx="10" fill="#dcfce7" stroke="#16a34a"/>
      <text x="585" y="100" font-weight="700">规则驱动求解</text><text x="585" y="128" font-size="14">走廊整段分层排布</text><text x="585" y="150" font-size="14">三方案 · 净高优先</text></g>
    <g><rect x="730" y="60" width="190" height="110" rx="10" fill="#dcfce7" stroke="#16a34a"/>
      <text x="825" y="100" font-weight="700">节点库</text><text x="825" y="128" font-size="14">接驳、翻弯、引出</text><text x="825" y="150" font-size="14">端部过渡、可施工检查</text></g>
    <g><rect x="960" y="60" width="210" height="110" rx="10" fill="#fef3c7" stroke="#d97706"/>
      <text x="1065" y="100" font-weight="700">成果与复核</text><text x="1065" y="128" font-size="14">断面图、三维预览</text><text x="1065" y="150" font-size="14">与人工方案对比</text></g>
    <g stroke="#64748b" stroke-width="2" marker-end="url(#a)"><line x1="210" y1="115" x2="248" y2="115"/><line x1="440" y1="115" x2="478" y2="115"/><line x1="690" y1="115" x2="728" y2="115"/><line x1="920" y1="115" x2="958" y2="115"/></g>
    <g><rect x="250" y="220" width="190" height="80" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
      <text x="345" y="255" font-weight="700">施工图（DXF）</text><text x="345" y="280" font-size="14">车位、车道、人防、设计说明</text></g>
    <g><rect x="480" y="220" width="210" height="80" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
      <text x="585" y="255" font-weight="700">规则库</text><text x="585" y="280" font-size="14">规范依据 · 编号 · 可审核</text></g>
    <g><rect x="960" y="220" width="210" height="80" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="6 4"/>
      <text x="1065" y="255" font-weight="700">回写 Revit</text><text x="1065" y="280" font-size="14">（开发中）</text></g>
    <g stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"><line x1="345" y1="220" x2="345" y2="172"/><line x1="585" y1="220" x2="585" y2="172"/><line x1="1065" y1="172" x2="1065" y2="218" stroke-dasharray="6 4"/></g>
  </g>
  <text x="20" y="35" font-size="22" font-weight="700" fill="#0f172a">管综工作台：流程</text>
